<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer Portfolio | Web & Content</title>
    
    <!-- 폰트: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    
    <style>
        :root {
            --main-color: #007fff;
            --bg-color: #ffffff;
            --text-color: #111111;
            --sub-text: #666666;
            --transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 1. 핵심: 부드러운 스크롤 설정 */
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- 인터렉티브: Reveal 효과 --- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: var(--transition);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- 네비게이션 --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        nav {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--main-color);
            text-decoration: none;
            letter-spacing: -1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 1rem;
            position: relative;
            cursor: pointer;
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0;
            width: 0; height: 2px;
            background: var(--main-color);
            transition: 0.3s;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at 10% 20%, rgba(0, 127, 255, 0.05) 0%, transparent 50%);
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .hero h1 span {
            color: var(--main-color);
        }

        /* --- Works Section --- */
        .section-padding {
            padding: 120px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--main-color);
            margin-bottom: 50px;
            display: block;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #f4f4f4;
            cursor: pointer;
            border-radius: 4px;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .gallery-item .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 127, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay h3 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
        }

        /* --- About Section --- */
        #about {
            background-color: #000;
            color: #fff;
        }

        .about-content {
            max-width: 800px;
        }

        .about-content h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        /* --- Contact Section (미니멀) --- */
        #contact {
            text-align: center;
            padding: 180px 0;
        }

        .email-link {
            font-size: clamp(1.5rem, 5vw, 3.5rem);
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            display: inline-block;
            transition: var(--transition);
        }

        .email-link:hover {
            color: var(--main-color);
            transform: scale(1.05);
        }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 2000;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .modal-content img {
            width: 100%;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .close-modal {
            position: fixed;
            top: 30px; right: 30px;
            font-size: 2.5rem;
            cursor: pointer;
            z-index: 2100;
            color: #000;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            nav ul { display: none; }
            .gallery { grid-template-columns: 1fr; }
            .section-padding { padding: 80px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="logo">DESIGNER.</a>
            <ul>
                <!-- 각 href가 섹션의 ID와 일치함 -->
                <li><a href="#works">Works</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1 class="reveal">Creative Web &<br><span>Content Design</span></h1>
            <p class="reveal" style="transition-delay: 0.2s;">스크롤을 내려 저의 작업물을 확인해보세요.</p>
        </section>

        <section id="works" class="section-padding">
            <span class="section-title reveal">Works</span>
            <div class="gallery">
                <div class="gallery-item reveal" onclick="openModal('work1')">
                    <img src="https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=800&q=80" alt="work">
                    <div class="overlay"><h3>Project 01</h3></div>
                </div>
                <div class="gallery-item reveal" onclick="openModal('work2')" style="transition-delay: 0.1s;">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80" alt="work">
                    <div class="overlay"><h3>Project 02</h3></div>
                </div>
                <div class="gallery-item reveal" onclick="openModal('work3')" style="transition-delay: 0.2s;">
                    <img src="https://images.unsplash.com/photo-1634942557034-1193396b6f07?auto=format&fit=crop&w=800&q=80" alt="work">
                    <div class="overlay"><h3>Project 03</h3></div>
                </div>
                <div class="gallery-item reveal" onclick="openModal('work4')">
                    <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80" alt="work">
                    <div class="overlay"><h3>Project 04</h3></div>
                </div>
            </div>
        </section>

        <section id="about" class="section-padding">
            <div class="about-content">
                <span class="section-title reveal" style="color: #fff;">About Me</span>
                <h2 class="reveal">비즈니스의 목표를<br>디자인의 언어로 풀어냅니다.</h2>
                <p class="reveal" style="color: #888;">웹과 모바일, 소셜 콘텐츠를 넘나들며 최적의 결과물을 제안합니다.</p>
            </div>
        </section>

        <section id="contact" class="section-padding">
            <span class="section-title reveal">Contact</span>
            <a href="mailto:yourname@example.com" class="email-link reveal">hello@yourdomain.com</a>
        </section>
    </main>

    <!-- Modal -->
    <div id="projectModal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <h2 id="modalTitle" style="font-size: 2.5rem; margin-bottom: 10px;">Project Title</h2>
            <p id="modalDesc" style="margin-bottom: 40px; color: #666;">상세 디자인 설명이 들어가는 부분입니다.</p>
            <img id="modalImg" src="" alt="Detail View">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1200&q=80" alt="process">
        </div>
    </div>

    <script>
        // 1. 부드러운 스크롤 보정 (자바스크립트 버전)
        document.querySelectorAll('nav a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                const targetSection = document.querySelector(targetId);
                
                if (targetSection) {
                    window.scrollTo({
                        top: targetSection.offsetTop - 70, // 헤더 높이만큼 보정
                        behavior: 'smooth'
                    });
                }
            });
        });

        // 2. 스크롤 애니메이션 (Reveal)
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 100) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);
        reveal(); // 초기 실행

        // 3. 모달 제어
        const modal = document.getElementById("projectModal");
        function openModal(id) {
            document.getElementById("modalTitle").innerText = "Project " + id;
            document.getElementById("modalImg").src = "https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1200&q=80";
            modal.style.display = "block";
            document.body.style.overflow = "hidden";
        }
        function closeModal() {
            modal.style.display = "none";
            document.body.style.overflow = "auto";
        }
        window.onclick = function(event) { if (event.target == modal) closeModal(); }
    </script>
</body>
</html>
